services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: golaya_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golaya_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILE_ACTIVE: dev
      DB_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Secreto solo para desarrollo (≥32 caracteres por HS256)
      JWT_SECRET: golaya-dev-secret-0123456789abcdefghijklmnop
      CORS_URLS: http://localhost:8000,http://localhost:5500,http://localhost:3000
      # Cloudinary vacío en local: el backend arranca igual y solo
      # fallará si alguien intenta subir una imagen.
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8000:80"

  seed:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: golaya_db
    volumes:
      - ./backend/DATABASE/seed_data.sql:/seed/seed_data.sql:ro
      - ./backend/scripts/wait-and-seed.sh:/seed/wait-and-seed.sh:ro
    entrypoint: ["/bin/sh", "/seed/wait-and-seed.sh"]
    restart: "no"

volumes:
  pgdata:
